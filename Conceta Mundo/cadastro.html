<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — Conceta Mundo</title>
  <meta name="description" content="Crie sua conta gratuita e faça parte da comunidade Conceta Mundo.">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      min-height: 100vh;
      background: var(--gradient-hero);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: var(--space-10) var(--space-6);
      position: relative;
      overflow-x: hidden;
    }

    .auth-orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.12; pointer-events: none; }
    .auth-orb-1 { width: 500px; height: 500px; background: var(--teal-500); top: -150px; right: -150px; }
    .auth-orb-2 { width: 400px; height: 400px; background: var(--amber-500); bottom: -100px; left: -100px; }

    .auth-card {
      background: rgba(14,18,36,0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: var(--radius-xl);
      padding: var(--space-10);
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
      animation: fadeIn 0.5s ease;
      margin-top: 60px;
    }

    .auth-logo { text-align: center; margin-bottom: var(--space-8); }
    .auth-logo-icon {
      width: 52px; height: 52px;
      background: var(--gradient-teal);
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; margin: 0 auto var(--space-4);
      box-shadow: var(--shadow-glow-teal);
    }

    .auth-title { font-size: 1.6rem; font-weight: 800; color: var(--white); margin-bottom: var(--space-2); }
    .auth-subtitle { font-size: 0.875rem; color: var(--gray-400); }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
    }

    .role-option {
      position: relative;
      cursor: pointer;
    }

    .role-option input { position: absolute; opacity: 0; width: 0; height: 0; }

    .role-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-5) var(--space-4);
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg);
      transition: all var(--transition-base);
      text-align: center;
    }

    .role-option input:checked + .role-label {
      border-color: var(--teal-400);
      background: rgba(0,201,177,0.1);
      box-shadow: 0 0 0 3px rgba(0,201,177,0.1);
    }

    .role-emoji { font-size: 1.8rem; }
    .role-name { font-size: 0.85rem; font-weight: 700; color: var(--white); }
    .role-desc { font-size: 0.72rem; color: var(--gray-500); }

    .egresso-fields {
      background: rgba(0,201,177,0.04);
      border: 1px solid rgba(0,201,177,0.12);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      margin-bottom: var(--space-5);
      display: none;
    }

    .egresso-fields.visible { display: block; animation: fadeIn 0.3s ease; }

    .egresso-fields-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--teal-400);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: var(--space-4);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }

    .auth-footer {
      text-align: center;
      margin-top: var(--space-5);
      font-size: 0.875rem;
      color: var(--gray-500);
    }

    .auth-footer a { color: var(--teal-400); font-weight: 600; }

    .back-home {
      position: fixed; top: var(--space-6); left: var(--space-6);
      display: flex; align-items: center; gap: var(--space-2);
      color: var(--gray-400); font-size: 0.875rem; font-weight: 500;
      text-decoration: none; transition: color var(--transition-fast); z-index: 10;
    }
    .back-home:hover { color: var(--teal-400); }

    .password-strength {
      height: 3px;
      border-radius: 3px;
      margin-top: var(--space-2);
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .password-strength-bar {
      height: 100%;
      border-radius: 3px;
      transition: all var(--transition-base);
      width: 0%;
    }

    .strength-weak { background: var(--coral-500); width: 33%; }
    .strength-medium { background: var(--amber-500); width: 66%; }
    .strength-strong { background: var(--teal-500); width: 100%; }
  </style>
</head>
<body>
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>

  <a href="index.html" class="back-home">← Voltar ao início</a>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🌍</div>
      <h1 class="auth-title">Criar conta gratuita</h1>
      <p class="auth-subtitle">Faça parte da comunidade Conceta Mundo</p>
    </div>

    <!-- Seleção de Papel -->
    <div class="form-group">
      <label class="form-label">Você é...</label>
      <div class="role-selector">
        <label class="role-option">
          <input type="radio" name="papel" value="estudante" id="rolEstudante" checked>
          <div class="role-label">
            <span class="role-emoji">🎒</span>
            <span class="role-name">Estudante</span>
            <span class="role-desc">Quero me informar sobre intercâmbio</span>
          </div>
        </label>
        <label class="role-option">
          <input type="radio" name="papel" value="egresso" id="rolEgresso">
          <div class="role-label">
            <span class="role-emoji">✈️</span>
            <span class="role-name">Egresso</span>
            <span class="role-desc">Já fiz intercâmbio e quero compartilhar</span>
          </div>
        </label>
      </div>
    </div>

    <form id="cadastroForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="nome">Nome completo</label>
        <input type="text" id="nome" class="form-input" placeholder="Seu nome completo" autocomplete="name" required>
        <span class="form-error" id="nomeError">Nome obrigatório.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input type="email" id="email" class="form-input" placeholder="seu@email.com" autocomplete="email" required>
        <span class="form-error" id="emailError">E-mail inválido.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="senha">Senha</label>
        <input type="password" id="senha" class="form-input" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
        <div class="password-strength">
          <div class="password-strength-bar" id="strengthBar"></div>
        </div>
        <span class="form-error" id="senhaError">Senha deve ter no mínimo 6 caracteres.</span>
      </div>

      <!-- Campos de Egresso -->
      <div class="egresso-fields" id="egressoFields">
        <div class="egresso-fields-title">✈️ Sua experiência de intercâmbio</div>

        <div class="form-row">
          <div class="form-group" style="margin-bottom:0">
            <label class="form-label" for="pais">País</label>
            <select id="pais" class="form-select form-input">
              <option value="">Selecione...</option>
              <option value="Irlanda">🇮🇪 Irlanda</option>
              <option value="Canadá">🇨🇦 Canadá</option>
              <option value="Portugal">🇵🇹 Portugal</option>
              <option value="Alemanha">🇩🇪 Alemanha</option>
              <option value="França">🇫🇷 França</option>
              <option value="Espanha">🇪🇸 Espanha</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label class="form-label" for="ano">Ano</label>
            <select id="ano" class="form-select form-input">
              <option value="">Selecione...</option>
              <option value="2024">2024</option>
              <option value="2023">2023</option>
              <option value="2022">2022</option>
              <option value="2021">2021</option>
              <option value="2020">2020</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-top: var(--space-4)">
          <label class="form-label" for="cidade">Cidade onde ficou</label>
          <input type="text" id="cidade" class="form-input" placeholder="Ex: Dublin, Toronto...">
        </div>
      </div>

      <span class="form-error" id="globalError" style="display:none; margin-bottom: var(--space-4);"></span>

      <button type="submit" class="btn btn-primary btn-full" id="btnCadastro">
        <span id="btnCadastroText">Criar conta gratuita 🚀</span>
        <div class="spinner" id="cadastroSpinner" style="display:none"></div>
      </button>
    </form>

    <div class="auth-footer">
      Já tem conta? <a href="login.html">Fazer login</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    Auth.redirectIfLoggedIn('dashboard.html');

    // Toggle campos de egresso
    document.querySelectorAll('input[name="papel"]').forEach(radio => {
      radio.addEventListener('change', function() {
        const fields = document.getElementById('egressoFields');
        fields.classList.toggle('visible', this.value === 'egresso');
      });
    });

    // Força de senha
    document.getElementById('senha').addEventListener('input', function() {
      const bar = document.getElementById('strengthBar');
      const len = this.value.length;
      bar.className = 'password-strength-bar';
      if (len === 0) { bar.style.width = '0'; return; }
      if (len < 6) bar.classList.add('strength-weak');
      else if (len < 10) bar.classList.add('strength-medium');
      else bar.classList.add('strength-strong');
    });

    // Submit
    document.getElementById('cadastroForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const papel = document.querySelector('input[name="papel"]:checked').value;
      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const globalError = document.getElementById('globalError');

      // Esconde erros
      document.querySelectorAll('.form-error').forEach(el => el.classList.remove('visible'));
      globalError.style.display = 'none';

      let valid = true;
      if (!nome) { document.getElementById('nomeError').classList.add('visible'); valid = false; }
      if (!email || !email.includes('@')) { document.getElementById('emailError').classList.add('visible'); valid = false; }
      if (senha.length < 6) { document.getElementById('senhaError').classList.add('visible'); valid = false; }
      if (!valid) return;

      // Loading
      document.getElementById('btnCadastroText').style.display = 'none';
      document.getElementById('cadastroSpinner').style.display = 'block';
      document.getElementById('btnCadastro').disabled = true;

      setTimeout(() => {
        const dados = {
          nome, email, senha, papel,
          pais: document.getElementById('pais')?.value || null,
          ano: document.getElementById('ano')?.value || null,
          cidade: document.getElementById('cidade')?.value || null,
        };

        const result = Auth.register(dados);
        if (result.ok) {
          Toast.success('Conta criada com sucesso! 🎉');
          setTimeout(() => window.location.href = 'dashboard.html', 900);
        } else {
          globalError.textContent = result.error;
          globalError.style.display = 'block';
          document.getElementById('btnCadastroText').style.display = 'inline';
          document.getElementById('cadastroSpinner').style.display = 'none';
          document.getElementById('btnCadastro').disabled = false;
        }
      }, 700);
    });
  </script>
</body>
</html>
